# Shared defaults for trajectory generation and local Qwen fine-tuning.
seed: 42
data_root: data
views: [topview]
num_rollouts: 500
num_frames: 20
split_percentages: [0.25, 0.25, 0.25, 0.25]

# Retained for the collaborator's historical RL-trajectory command. The new
# generators select camera modes explicitly with --camera-modes.
enable_wrist_follow_camera: true

tasks:
  PegInsertionSide-v1:
    description: Pick up the peg and insert it into the side hole of the box.
  PickCube-v1:
    description: Grasp the red cube and move it to the green target goal position.
  PushCube-v1:
    description: Push the cube to the red-and-white circular goal region.

finetuning_prompt_template: |
  You are an expert roboticist tasked to predict task completion
  percentages for frames of a robot for the task of {task_description}.
  The task completion percentages are between 0 and 100, where 100
  corresponds to full task completion.

  Initial robot scene: [IMG]
  In the initial robot scene, the task completion percentage is 0.

  Now, for the task of {task_description}, output the task completion
  percentage for the following frames. For each frame, you must format your response exactly as follows, ending with a score enclosed in xml tags:
  Frame X:
  Task Completion Percentage: <score>XX%</score>

  Please provide your predictions for the following frames:
  {frames_list}
